[project]
name = "decision-model-eval"
version = "0.1.0"
description = "日本語Decision Modelの公開データによる zero-shot 比較評価"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "matplotlib>=3.9,<4",
    "pyyaml>=6,<7",
    "huggingface-hub>=1,<2",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
