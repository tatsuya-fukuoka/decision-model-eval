      - "推論経路 decision2/__init__.py → api.py → qwen.py / _vendor/dev2model/*：socket・urllib・requests・httpx・subprocess・os.system・eval/exec は無い"
      - "snapshot_download は qwen.resolve_base（MODEL_MANIFEST.json の base が null なので呼ばれない。基盤は同梱の backbone/）と modeling_decision2.py（transformers の AutoModel 経路用。公式アダプタは使わない）だけ"
